<!DOCTYPE html>
<html>
<head>
    <title>Advanced Opacity Demo</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: linear-gradient( 107.1deg,  rgba(111,63,255,1) 11.1%, rgba(21,192,229,1) 54.8%, rgba(255,229,189,1) 82.9% );
            color: white;
            text-align: center;
        }

        h1 {
            padding: 20px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            position: relative;
            height: 250px;
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: scale(1.05);
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            transition: 0.3s;
        }

        /* Different opacity levels */
        .op1 { opacity: 1; }
        .op2 { opacity: 0.7; }
        .op3 { opacity: 0.5; }
        .op4 { opacity: 0.3; }

        /* Hover effect: reduce overlay opacity */
        .card:hover .overlay {
            opacity: 0.1;
        }
    </style>
</head>

<body>

    <h1>✨ Advanced CSS Opacity Demo ✨</h1>

    <div class="container">

        <div class="card">
            <img src="https://picsum.photos/id/1015/400/300">
            <div class="overlay op1">Opacity 1</div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1016/400/300">
            <div class="overlay op2">Opacity 0.7</div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1018/400/300">
            <div class="overlay op3">Opacity 0.5</div>
        </div>

        <div class="card">
            <img src="https://picsum.photos/id/1020/400/300">
            <div class="overlay op4">Opacity 0.3</div>
        </div>

    </div>

</body>
</html>
